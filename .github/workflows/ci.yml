# ─────────────────────────────────────────────────────────────
# Socrates-Cube CI/CD 流水线
# 触发条件：push 到 main/dev 分支，以及 Pull Request 到 main
#
# 三个并行 Job：
#   backend-test  — Python 单元测试（所有分支）
#   frontend-build — TypeScript 类型检查 + Vite 构建（所有分支）
#   docker-build  — Docker 镜像构建验证（仅 main 分支）
# ─────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main, dev, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1：后端单元测试 ─────────────────────────────────────
  backend-test:
    name: Backend Tests (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create minimal .env for tests
        run: |
          cp .env.example .env
          echo "MOCK_MODE=true" >> .env
          echo "DB_PATH=:memory:" >> .env

      - name: Run unit tests
        run: |
          python -m pytest tests/unit/ \
            -v \
            --tb=short \
            --timeout=60 \
            -x
        env:
          MOCK_MODE: "true"
          PYTHONPATH: .

      - name: Upload test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: .pytest_cache/

  # ── Job 2：前端构建与类型检查 ────────────────────────────────
  frontend-build:
    name: Frontend Build (Node 20)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check + Vite build
        run: npm run build
        env:
          VITE_API_BASE_URL: ''
          NODE_ENV: production

      - name: Check bundle size (warn if > 5MB)
        run: |
          DIST_SIZE=$(du -sm dist/ | cut -f1)
          echo "Bundle size: ${DIST_SIZE}MB"
          if [ "$DIST_SIZE" -gt 5 ]; then
            echo "::warning::Bundle size ${DIST_SIZE}MB exceeds 5MB threshold"
          fi

  # ── Job 3：Docker 镜像构建验证（仅 main 分支）──────────────
  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [backend-test, frontend-build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: Dockerfile
          push: false
          tags: socrates-cube-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          dockerfile: frontend/Dockerfile
          push: false
          tags: socrates-cube-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
