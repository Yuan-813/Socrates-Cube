# ──────────────────────────────────────────────────────────────────
# Socrates-Cube Nginx 生产级配置
# 功能： SPA 回退、/api 反向代理、SSE 长连接、Gzip 压缩、安全头、缓存策略
# ──────────────────────────────────────────────────────────────────

# Gzip 压缩（全局配置，需在 http 块内或 server 外层操作）
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml
    font/woff
    font/woff2;

server {
    listen       80;
    server_name  localhost;

    # ── 安全 HTTP 响应头 ───────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 注：生产环境开启 HTTPS 后再启用 HSTS
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── HTML 文件：no-cache（确保版本更新立即生效） ───────────────────
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires 0 always;
    }

    # ── Vite 打包静态资源：持久缓存（内容哈希指纹保证唯一性） ──
    location /assets/ {
        root   /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # ── API 反向代理 ──────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ── SSE 流式接口：关闭缓冲，超长连接超时 ─────────────
    location ~ ^/api/v1/(chat|diagnosis)/stream {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_connect_timeout 10s;
        # SSE 需要 chunked 传输
        chunked_transfer_encoding on;
    }

    # ── 错误页 ────────────────────────────────────────────────
    error_page 404              /index.html;
    error_page 500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
